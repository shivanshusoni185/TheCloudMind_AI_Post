# ── HTTP (:80) ── serve ACME challenge, redirect everything else to HTTPS
server {
    listen 80;
    server_name cloudmindai.in www.cloudmindai.in;

    # Let's Encrypt HTTP-01 challenge (issuance + renewals)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://cloudmindai.in$request_uri;
    }
}

# ── HTTPS (:443) www → redirect to canonical root domain
server {
    listen 443 ssl;
    http2 on;
    server_name www.cloudmindai.in;

    ssl_certificate     /etc/letsencrypt/live/cloudmindai.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cloudmindai.in/privkey.pem;

    return 301 https://cloudmindai.in$request_uri;
}

# ── HTTPS (:443) canonical site
server {
    listen 443 ssl;
    http2 on;
    server_name cloudmindai.in;

    ssl_certificate     /etc/letsencrypt/live/cloudmindai.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cloudmindai.in/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # API proxy — strip /api prefix before forwarding to backend container
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        client_max_body_size 20M;
    }

    # Static assets with long cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — all routes served by index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
