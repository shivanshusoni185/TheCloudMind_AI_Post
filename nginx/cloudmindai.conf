# Rate-limit zone for the open, unauthenticated MCP endpoint (per client IP).
limit_req_zone $binary_remote_addr zone=mcp_limit:10m rate=10r/s;
# JEV AI chat calls a paid LLM — cap each visitor at ~10 questions/minute.
limit_req_zone $binary_remote_addr zone=jev_limit:10m rate=10r/m;

# Edge cache for article images. They are stored as blobs in Postgres, so
# without this every first view of an image is a full DB round-trip. Image
# URLs carry ?v=<updated_at>, so a replaced image gets a new cache key.
proxy_cache_path /var/cache/nginx/images levels=1:2 keys_zone=img_cache:10m
                 max_size=1g inactive=30d use_temp_path=off;

# Micro-cache for public read APIs (news/jobs lists + detail). The DB is in
# Mumbai and this VPS is in New York, so every uncached query costs ~200 ms+.
# Responses are fresh for 30 s; after that the stale copy is served instantly
# while one background request refreshes it, so visitors never wait on the DB.
proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api_cache:10m
                 max_size=100m inactive=1d use_temp_path=off;

# ── HTTP (:80) ── serve ACME challenge, redirect everything else to HTTPS
server {
    listen 80;
    server_name cloudmindai.in www.cloudmindai.in;

    # Let's Encrypt HTTP-01 challenge (issuance + renewals)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://cloudmindai.in$request_uri;
    }
}

# ── HTTPS (:443) www → redirect to canonical root domain
server {
    listen 443 ssl;
    http2 on;
    server_name www.cloudmindai.in;

    ssl_certificate     /etc/letsencrypt/live/cloudmindai.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cloudmindai.in/privkey.pem;

    return 301 https://cloudmindai.in$request_uri;
}

# ── HTTPS (:443) canonical site
server {
    listen 443 ssl;
    http2 on;
    server_name cloudmindai.in;

    ssl_certificate     /etc/letsencrypt/live/cloudmindai.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cloudmindai.in/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Article images — served from the edge cache after the first request.
    location ^~ /api/news/image/ {
        proxy_pass http://backend:8000/news/image/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache img_cache;
        proxy_cache_valid 200 30d;
        proxy_cache_valid 404 1m;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # Public read APIs — micro-cached (see api_cache above). Admin routes and
    # everything else fall through to the plain /api/ proxy below.
    location ~ ^/api/(news|jobs)(/|$) {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache api_cache;
        proxy_cache_key $request_uri;
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 30s;
        proxy_cache_valid 404 10s;
        proxy_cache_lock on;
        proxy_cache_background_update on;
        proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # JEV AI chat — rate-limited, never cached.
    location = /api/jev/chat {
        limit_req zone=jev_limit burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8000/jev/chat;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        client_max_body_size 64k;
    }

    # API proxy — strip /api prefix before forwarding to backend container
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        client_max_body_size 20M;
    }

    # MCP server (read-only). Streamable-HTTP uses SSE, so buffering must be off
    # and the read timeout long-lived. Auth is enforced by the mcp service.
    location /mcp {
        limit_req zone=mcp_limit burst=20 nodelay;
        proxy_pass http://mcp:8765/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # MCP OAuth endpoints (connector "Sign in / Authorize" flow). Discovery
    # metadata, dynamic client registration, authorize/token/revoke, and the
    # login page — all served by the mcp container. Do not collide with the SPA
    # (which uses /admin/login, /jobs, etc., not these paths).
    location ^~ /.well-known/oauth-authorization-server { proxy_pass http://mcp:8765; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
    location ^~ /.well-known/oauth-protected-resource   { proxy_pass http://mcp:8765; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
    location = /authorize { limit_req zone=mcp_limit burst=20 nodelay; proxy_pass http://mcp:8765; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
    location = /token     { limit_req zone=mcp_limit burst=20 nodelay; proxy_pass http://mcp:8765; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
    location = /register  { limit_req zone=mcp_limit burst=20 nodelay; proxy_pass http://mcp:8765; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
    location = /revoke    { limit_req zone=mcp_limit burst=20 nodelay; proxy_pass http://mcp:8765; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
    location = /login     { limit_req zone=mcp_limit burst=20 nodelay; proxy_pass http://mcp:8765; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }

    # Static assets with long cache
    location ~* \.(js|css|png|jpg|jpeg|gif|webp|avif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must always be revalidated so a new deploy's hashed assets
    # are picked up immediately (the assets themselves are cached for a year).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback — all routes served by index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
# ── auth.cloudmindai.in → Django login app running on the host (:8443) ──
server {
    listen 80;
    server_name auth.cloudmindai.in;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://auth.cloudmindai.in$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name auth.cloudmindai.in;

    ssl_certificate     /etc/letsencrypt/live/auth.cloudmindai.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auth.cloudmindai.in/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 5M;

    location / {
        # Proxy to the host Django app (host nginx :8443, reached via docker gateway).
        proxy_pass https://172.18.0.1:8443;
        proxy_ssl_server_name on;
        proxy_ssl_name auth.cloudmindai.in;
        # No port in Host -> allauth builds a portless OAuth callback URL:
        # https://auth.cloudmindai.in/accounts/google/login/callback/
        proxy_set_header Host auth.cloudmindai.in;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}
