services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    expose:
      - "8000"
    networks:
      - app

  mcp:
    build: ./mcp-server
    restart: unless-stopped
    environment:
      # Read-only MCP server (streamable-http). Data is fetched from the public
      # API so article/job URLs resolve to real https://cloudmindai.in links.
      MCP_TRANSPORT: http
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8765"
      # Bearer token gating the /mcp endpoint. Set in /opt/cloudmind/.env on the
      # server (compose substitutes it here); empty = no auth.
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-}
    expose:
      - "8765"
    depends_on:
      - backend
    networks:
      - app

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    depends_on:
      - backend
      - mcp
    networks:
      - app
    # Reload every 6h so renewed certificates are picked up without a restart
    command: /bin/sh -c "while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g 'daemon off;'"

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    # Attempt renewal twice a day; certbot only renews when near expiry
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"

volumes:
  certbot-etc:
  certbot-www:

networks:
  app:
    driver: bridge
